# Admin panel (Sveltia CMS) for almaty-travel.kz. How-to: docs/CMS.md. Field labels are what the owner sees.
# Saving commits to codex/demo; .github/workflows/cms.yml then writes the change into the HTML pages
# (tools/cms.py) and rebuilds the live-site branch. The live server is updated only by a deploy.
backend:
  name: github
  repo: adirov/almaty-travel-review
  branch: codex/demo
  commit_messages:
    create: 'CMS: создано «{{slug}}» ({{collection}})'
    update: 'CMS: изменено «{{slug}}» ({{collection}})'
    delete: 'CMS: удалено «{{slug}}» ({{collection}})'
    uploadMedia: 'CMS: загружено фото {{path}}'
    deleteMedia: 'CMS: удалено фото {{path}}'
app_title: Almaty Travel — админка
site_url: https://adirov.github.io/almaty-travel-review/ru/
media_folder: assets/images/cms
public_folder: /assets/images/cms
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600
i18n:
  structure: multiple_files
  locales:
  - en
  - ru
  default_locale: en
slug:
  encoding: ascii
  clean_accents: true
output:
  omit_empty_optional_fields: true
collections:
- name: pages_ru
  label: Туры и страницы (русский)
  label_singular: Страница
  folder: content/pages/ru
  extension: md
  format: yaml-frontmatter
  create: false
  delete: false
  identifier_field: h1
  summary: '{{fields.h1}} — {{fields.url}}'
  sortable_fields:
  - h1
  - section
  view_groups:
    default: section
    groups:
    - name: section
      label: Раздел
      field: section
  editor:
    preview: false
  description: Русская версия сайта. После «Сохранить» страница на проверочном сайте обновится через 2–3 минуты. На almaty-travel.kz
    правки попадут после выкладки (деплоя).
  fields:
  - name: page
    widget: hidden
  - name: url
    widget: hidden
  - name: section
    widget: hidden
  - name: text_locked
    widget: hidden
  - name: title
    label: 'SEO: заголовок во вкладке браузера и в Google'
    widget: string
    hint: До ~60 символов. Обычно «Название тура | Kazakhstan Travel».
  - name: description
    label: 'SEO: описание для Google'
    widget: text
    hint: До ~155 символов. Показывается в Google под заголовком.
  - name: h1
    label: Заголовок на странице
    widget: string
  - name: body
    label: Текст страницы
    widget: richtext
    required: false
    modes:
    - rich_text
    - raw
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - bulleted-list
    - numbered-list
    - quote
    editor_components: []
    hint: Текст под заголовком. «Цитата» = выделенное вступление тура. Строка {{фото}} — место, где стоят «Фото в тексте».
      Если поле пустое и страница старая (сложная вёрстка), текст правится только через код, а здесь — SEO и фото.
  - name: photos
    label: Фото в тексте
    widget: list
    required: false
    collapsed: true
    summary: '{{fields.alt}}'
    hint: Сетка фото внутри текста (на месте строки {{фото}}, иначе в конце текста). Порядок меняется перетаскиванием.
    fields:
    - name: image
      label: Фото
      widget: image
      choose_url: false
    - name: alt
      label: Подпись (для Google и незрячих)
      widget: string
      required: false
      hint: Что на фото, 3–8 слов. Например «Озеро Кольсай осенью».
  - name: galleries
    label: Фотогалереи
    widget: list
    required: false
    collapsed: true
    summary: '{{fields.title}}'
    hint: Блоки «Фото …» ниже текста. Удалите все фото из галереи, чтобы убрать её со страницы.
    fields:
    - name: id
      widget: hidden
    - name: title
      label: Заголовок галереи
      widget: string
    - name: photos
      label: Фото (видны сразу)
      widget: list
      collapsed: true
      summary: '{{fields.alt}}'
      fields:
      - name: image
        label: Фото
        widget: image
        choose_url: false
      - name: alt
        label: Подпись (для Google и незрячих)
        widget: string
        required: false
        hint: Что на фото, 3–8 слов. Например «Озеро Кольсай осенью».
    - name: more_label
      label: Надпись над скрытыми фото
      widget: string
      required: false
      hint: Например «Ещё фото с наших поездок». Число фото добавится само.
    - name: more
      label: Ещё фото (открываются по клику)
      widget: list
      required: false
      collapsed: true
      summary: '{{fields.alt}}'
      fields:
      - name: image
        label: Фото
        widget: image
        choose_url: false
      - name: alt
        label: Подпись (для Google и незрячих)
        widget: string
        required: false
        hint: Что на фото, 3–8 слов. Например «Озеро Кольсай осенью».
