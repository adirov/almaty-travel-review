- name: articles
  label: Статьи (гид)
  label_singular: Статья
  folder: articles
  extension: md
  format: yaml-frontmatter
  create: true
  delete: false
  i18n:
    structure: multiple_files
    locales:
    - en
    - ru
    default_locale: en
  slug:
    editable: true
    i18n: duplicate
  identifier_field: title
  summary: '{{fields.title}} · {{fields.status}}'
  sortable_fields:
  - date
  - title
  view_groups:
    default: status
    groups:
    - name: status
      label: Статус
      field: status
  editor:
    preview: false
  description: 'Статьи раздела «Гид» (/en/guide/…, /ru/guide/…). Английская версия — основная, русская — вкладка в редакторе.
    «Черновик» виден только на проверочном сайте с жёлтой плашкой, на almaty-travel.kz — только «Опубликовано». Удаление отключено:
    чтобы убрать статью, верните её в черновик.'
  fields:
  - name: title
    label: Заголовок
    widget: string
    i18n: true
  - name: description
    label: 'SEO: описание для Google'
    widget: text
    i18n: true
    hint: До ~155 символов.
  - name: status
    label: Статус
    widget: select
    i18n: true
    default: draft
    options:
    - label: Черновик
      value: draft
    - label: Опубликовано
      value: published
  - name: date
    label: Дата
    widget: datetime
    i18n: duplicate
    time_format: false
    format: YYYY-MM-DD
    default: '{{now}}'
  - name: image
    label: Обложка
    widget: image
    required: false
    i18n: duplicate
    choose_url: false
  - name: image_alt
    label: Подпись к обложке
    widget: string
    required: false
    i18n: true
  - name: body
    label: Текст статьи
    widget: richtext
    i18n: true
    modes:
    - rich_text
    - raw
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - bulleted-list
    - numbered-list
    editor_components: []
    hint: Подзаголовки — «Заголовок 2» и «Заголовок 3». Ссылки на свои страницы пишите без домена, например /en/tours/.
